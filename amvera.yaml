---
meta:
  environment: python
  toolchain:
    name: pip
    version: 3.11
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  persistenceMount: /data
  command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate
    && gunicorn config.wsgi:application --bind 0.0.0.0:80"
  containerPort: 80
  russianTrustedCa: false
  singleton: true
  zeroDowntime: false
