meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: requirements.txt

run:
  command: sh -c "python grant_permissions.py && python manage.py migrate --noinput ; gunicorn config.wsgi:application --bind 0.0.0.0:80"
  persistenceMount: /data
  containerPort: 80
