meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: requirements.txt
  additionalCommands:
    - python manage.py collectstatic --noinput

run:
  command: gunicorn config.wsgi:application --bind 0.0.0.0:80
  persistenceMount: /data
  containerPort: 80